<!doctype html>
<html lang="en">

<meta charset="utf-8">

<body>
<title>CTTC Network Explorer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root{
    --ground:#F5F7F7;--surface:#FFFFFF;--surface-2:#EBF0F0;--surface-3:#E1E8E8;
    --ink:#0F191D;--ink-2:#465A60;--ink-3:#75878C;
    --rule:#D4DCDC;--rule-strong:#B4C2C2;
    --accent:#0B6E75;--accent-soft:#DFEEEE;
    --amber:#94590F;--amber-soft:#F4EADA;
    --violet:#564BA3;--violet-soft:#E9E6F5;
    --stop:#96361F;--stop-soft:#F6E4DE;
    --ok:#1F6B47;
    --edge:#A9B8B8;--edge-dim:#DCE3E3;
    --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
    --f-body:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif;
    --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#0B1315;--surface:#111C1F;--surface-2:#16252A;--surface-3:#1D3036;
      --ink:#E7EFEF;--ink-2:#A2B3B7;--ink-3:#77898D;
      --rule:#22363B;--rule-strong:#345056;
      --accent:#4FC7CE;--accent-soft:#0E2E30;
      --amber:#DFA353;--amber-soft:#2E2211;
      --violet:#A79AEE;--violet-soft:#201C38;
      --stop:#E88A6B;--stop-soft:#33170F;
      --ok:#5FBF8D;
      --edge:#3A5257;--edge-dim:#1D2B2F;
    }
  }
  :root[data-theme="dark"]{
    --ground:#0B1315;--surface:#111C1F;--surface-2:#16252A;--surface-3:#1D3036;
    --ink:#E7EFEF;--ink-2:#A2B3B7;--ink-3:#77898D;
    --rule:#22363B;--rule-strong:#345056;
    --accent:#4FC7CE;--accent-soft:#0E2E30;
    --amber:#DFA353;--amber-soft:#2E2211;
    --violet:#A79AEE;--violet-soft:#201C38;
    --stop:#E88A6B;--stop-soft:#33170F;
    --ok:#5FBF8D;
    --edge:#3A5257;--edge-dim:#1D2B2F;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--ground);color:var(--ink);
    font-family:var(--f-body);font-size:14px;line-height:1.5;
    height:100vh;height:100dvh;overflow:hidden;
    display:grid;grid-template-rows:auto 1fr;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- header ---------- */
  header{
    display:flex;align-items:center;gap:16px;padding:0 16px;height:56px;
    border-bottom:1px solid var(--rule);background:var(--surface);
    overflow-x:auto;flex:none;
  }
  .brand{font-family:var(--f-display);font-weight:700;font-variation-settings:"wdth" 118;
    letter-spacing:-.01em;white-space:nowrap;font-size:15px;}
  .brand span{color:var(--accent);}
  .ctl{display:flex;align-items:center;gap:7px;white-space:nowrap;}
  .ctl label{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink-3);}
  select,input[type=search]{
    font-family:var(--f-body);font-size:12.5px;color:var(--ink);
    background:var(--surface-2);border:1px solid var(--rule);border-radius:2px;
    padding:5px 8px;outline:none;
  }
  select:focus-visible,input:focus-visible{border-color:var(--accent);}
  input[type=search]{width:190px;}
  .btn{
    font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;
    background:var(--surface-2);border:1px solid var(--rule);color:var(--ink-2);
    padding:6px 11px;border-radius:2px;cursor:pointer;white-space:nowrap;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent);}
  .btn.on{background:var(--accent);border-color:var(--accent);color:var(--surface);}
  .spacer{flex:1;}
  .searchwrap{position:relative;}
  .results{
    position:absolute;top:34px;left:0;width:280px;max-height:280px;overflow-y:auto;
    background:var(--surface);border:1px solid var(--rule-strong);border-radius:2px;
    box-shadow:0 8px 24px rgba(0,0,0,.14);z-index:40;display:none;
  }
  .results.open{display:block;}
  .results div{padding:7px 11px;cursor:pointer;font-size:12.5px;border-bottom:1px solid var(--rule);}
  .results div:last-child{border-bottom:none;}
  .results div:hover{background:var(--accent-soft);}
  .results small{color:var(--ink-3);font-family:var(--f-mono);font-size:10.5px;display:block;}

  /* ---------- main ---------- */
  main{display:grid;grid-template-columns:1fr 370px;min-height:0;}
  @media (max-width:900px){
    main{grid-template-columns:1fr;grid-template-rows:1fr 46vh;}
  }
  #stage{position:relative;min-width:0;min-height:0;background:var(--ground);}
  canvas{display:block;width:100%;height:100%;cursor:grab;}
  canvas.grabbing{cursor:grabbing;}

  .overlay{position:absolute;pointer-events:none;font-family:var(--f-mono);font-size:10.5px;}
  #legend{
    left:14px;bottom:14px;background:var(--surface);border:1px solid var(--rule);
    padding:10px 12px;border-radius:2px;display:flex;flex-direction:column;gap:5px;
    color:var(--ink-2);box-shadow:0 2px 10px rgba(0,0,0,.06);max-width:240px;
  }
  #legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:7px;vertical-align:-1px;}
  #legend .hdr{color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase;font-size:9.5px;margin-bottom:2px;}
  #hint{right:14px;bottom:14px;color:var(--ink-3);text-align:right;line-height:1.7;}
  #tip{
    background:var(--surface);border:1px solid var(--rule-strong);padding:7px 10px;
    border-radius:2px;box-shadow:0 4px 14px rgba(0,0,0,.15);display:none;z-index:30;
    max-width:260px;color:var(--ink);font-size:11px;line-height:1.55;
  }
  #tip b{font-family:var(--f-body);font-size:12.5px;}
  #tip em{color:var(--ink-3);font-style:normal;}
  #banner{
    left:14px;top:14px;background:var(--amber-soft);border:1px solid var(--amber);
    color:var(--amber);padding:6px 11px;border-radius:2px;letter-spacing:.04em;
  }

  /* ---------- panel ---------- */
  aside{
    border-left:1px solid var(--rule);background:var(--surface);
    display:flex;flex-direction:column;min-height:0;min-width:0;
  }
  @media (max-width:900px){aside{border-left:none;border-top:1px solid var(--rule);}}
  .tabs{display:flex;border-bottom:1px solid var(--rule);flex:none;}
  .tab{
    flex:1;padding:11px 8px;background:none;border:none;border-bottom:2px solid transparent;
    font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-3);cursor:pointer;
  }
  .tab.on{color:var(--accent);border-bottom-color:var(--accent);}
  .panelbody{overflow-y:auto;padding:16px;flex:1;min-height:0;}
  .panelbody h2{font-family:var(--f-display);font-size:17px;font-weight:600;margin:0 0 3px;
    font-variation-settings:"wdth" 110;line-height:1.2;}
  .panelbody .sub{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);
    letter-spacing:.06em;margin-bottom:14px;}
  .kv{display:grid;grid-template-columns:96px 1fr;gap:5px 10px;font-size:12.5px;margin-bottom:14px;}
  .kv dt{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ink-3);padding-top:2px;}
  .kv dd{margin:0;color:var(--ink);word-break:break-word;}
  .badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
  .badge{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
    padding:3px 8px;border-radius:9px;border:1px solid;}
  .badge.warn{background:var(--amber-soft);color:var(--amber);border-color:var(--amber);}
  .badge.bad{background:var(--stop-soft);color:var(--stop);border-color:var(--stop);}
  .badge.good{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);}
  .badge.info{background:var(--violet-soft);color:var(--violet);border-color:var(--violet);}
  .sechead{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink-3);margin:16px 0 8px;padding-top:12px;border-top:1px solid var(--rule);}
  .list{display:flex;flex-direction:column;gap:1px;background:var(--rule);border:1px solid var(--rule);}
  .row{background:var(--surface);padding:8px 10px;font-size:12px;cursor:pointer;display:flex;
    justify-content:space-between;gap:10px;align-items:baseline;}
  .row:hover{background:var(--surface-2);}
  .row .n{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);white-space:nowrap;
    font-variant-numeric:tabular-nums;}
  .row b{font-weight:500;}
  .row.static{cursor:default;}
  .row.static:hover{background:var(--surface);}
  .meter{height:5px;background:var(--surface-3);border-radius:3px;overflow:hidden;margin-top:5px;}
  .meter i{display:block;height:100%;background:var(--accent);}
  .meter i.hot{background:var(--amber);}
  .path{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-2);line-height:1.9;
    word-break:break-all;}
  .path .add{color:var(--amber);}
  .path .drop{color:var(--ink-3);text-decoration:line-through;}
  .note{font-size:12px;color:var(--ink-2);margin-bottom:12px;}
  .note b{color:var(--ink);}
  .card{border:1px solid var(--rule);background:var(--surface);margin-bottom:14px;}
  .card > .ch{padding:10px 12px;background:var(--surface-2);border-bottom:1px solid var(--rule);
    display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .card > .ch b{font-family:var(--f-display);font-size:13px;font-weight:600;font-variation-settings:"wdth" 108;}
  .card > .ch span{font-family:var(--f-mono);font-size:10px;color:var(--ink-3);letter-spacing:.08em;}
  .card .cb{padding:10px 12px;font-size:12px;color:var(--ink-2);}
  .card .cb p{margin:0 0 8px;}
  .card .list{border-left:none;border-right:none;border-bottom:none;margin-top:8px;}
  .qbtn{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;background:none;
    border:1px solid var(--rule-strong);color:var(--ink-2);padding:5px 9px;border-radius:2px;
    cursor:pointer;margin-top:8px;}
  .qbtn:hover{border-color:var(--accent);color:var(--accent);}
  :focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
</style>

<header>
  <div class="brand">CTTC <span>Network Explorer</span></div>

  <div class="ctl searchwrap">
    <input type="search" id="q" placeholder="Search device, circuit, subscriber…" autocomplete="off">
    <div class="results" id="results"></div>
  </div>

  <div class="ctl">
    <label for="detail">Detail</label>
    <select id="detail">
      <option value="1">Backbone</option>
      <option value="2" selected>+ OLT</option>
      <option value="3">+ PON</option>
    </select>
  </div>

  <div class="ctl">
    <label for="colorby">Colour</label>
    <select id="colorby">
      <option value="role">Role</option>
      <option value="vendor">Vendor</option>
      <option value="release">Release</option>
      <option value="site">Site</option>
    </select>
  </div>

  <div class="ctl">
    <label for="mode">Highlight</label>
    <select id="mode">
      <option value="none">None</option>
      <option value="drift">Version drift</option>
      <option value="defect">Defect exposure</option>
      <option value="paths">Path drift</option>
      <option value="incident">Live incident</option>
    </select>
  </div>

  <div class="spacer"></div>
  <button class="btn" id="layout">Layered</button>
  <button class="btn" id="fit">Fit</button>
</header>

<main>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div class="overlay" id="banner">Synthetic demo data — real counts, placeholder identifiers</div>
    <div class="overlay" id="legend"></div>
    <div class="overlay" id="hint">drag to pan · scroll to zoom · click a node<br>double-click a PON to expand its ONTs</div>
    <div class="overlay" id="tip"></div>
  </div>

  <aside>
    <div class="tabs">
      <button class="tab on" data-tab="inspect">Inspect</button>
      <button class="tab" data-tab="findings">Findings</button>
    </div>
    <div class="panelbody" id="panel"></div>
  </aside>
</main>

DATA.onts.forEach(o => byId.set(o.id, Object.assign({kind:'ont'}, o)));
DATA.subs.forEach(s => byId.set(s.id, Object.assign({kind:'sub'}, s)));
DATA.services.forEach(s => byId.set(s.id, Object.assign({kind:'service'}, s)));
const portDev = new Map(DATA.ports.map(p => [p.id, p.dev]));
const portName = new Map(DATA.ports.map(p => [p.id, p.name]));
const ontBySub = new Map(DATA.onts.filter(o=>o.sub).map(o => [o.sub, o.id]));
const svcBySub = new Map(DATA.services.filter(s=>s.sub).map(s => [s.sub, s.id]));
const ontsByPon = new Map();
DATA.onts.forEach(o => { if(!ontsByPon.has(o.pon)) ontsByPon.set(o.pon, []); ontsByPon.get(o.pon).push(o.id); });
const alarmOn = new Map();
DATA.alarms.forEach(a => alarmOn.set(a.on, a));

const TIER = {core:0, aggregation:1, access:2, olt:3};
const defectIds = new Set(DATA.findings.defects.map(r => r.id));
const driftIds  = new Set(DATA.findings.drift.map(r => r.id));
const driftedSvcDevices = new Set();
DATA.findings.paths.forEach(r => {
  const s = byId.get(r.id);
  (s.devices||[]).forEach(d => driftedSvcDevices.add(d));
});
const incident = DATA.findings.incident;

/* --------------------------------------------------------------- viewport */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
let view = {k:1, x:0, y:0};
let nodes = [], edges = [];
let expanded = new Set();
let selected = null, hovered = null;
let layoutMode = 'layered';
let raf = null, ticks = 0;

let C = {};
function readTheme(){
  const s = getComputedStyle(document.documentElement);
  const g = n => s.getPropertyValue(n).trim();
  C = {
    ink:g('--ink'), ink2:g('--ink-2'), ink3:g('--ink-3'),
    surface:g('--surface'), surface2:g('--surface-2'), ground:g('--ground'),
    rule:g('--rule'), ruleStrong:g('--rule-strong'),
    accent:g('--accent'), amber:g('--amber'), violet:g('--violet'),
    stop:g('--stop'), ok:g('--ok'), edge:g('--edge'), edgeDim:g('--edge-dim')
  };
  // categorical colours must read on whichever ground the viewer's theme paints
  const m = /(\d+),\s*(\d+),\s*(\d+)/.exec(C.ground) ||
            [0, parseInt(C.ground.slice(1,3),16), parseInt(C.ground.slice(3,5),16), parseInt(C.ground.slice(5,7),16)];
  const lum = (0.299*+m[1] + 0.587*+m[2] + 0.114*+m[3]);
  palette = lum < 128 ? PAL_DARK : PAL_LIGHT;
  if (ready) legend();
}
readTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readTheme(); draw(); });
new MutationObserver(() => { readTheme(); draw(); })
  .observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});

let fitted = false;
function resize(){
  const r = document.getElementById('stage').getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = r.width; H = r.height;
  if (!W || !H) return;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (!fitted){ fit(); fitted = true; }
  draw();
}
new ResizeObserver(resize).observe(document.getElementById('stage'));

/* ----------------------------------------------------------------- build */
function build(){
  const detail = +document.getElementById('detail').value;
  const keepDev = d => detail >= 2 ? true : d.role !== 'olt';
  const prev = new Map(nodes.map(n => [n.id, n]));
  nodes = []; edges = [];

  DATA.devices.filter(keepDev).forEach(d => nodes.push(mk(d.id, 'device', TIER[d.role])));
  if (detail >= 3) DATA.pons.forEach(p => nodes.push(mk(p.id, 'pon', 4)));
  expanded.forEach(pid => (ontsByPon.get(pid)||[]).forEach(o => nodes.push(mk(o, 'ont', 5))));

  const present = new Set(nodes.map(n => n.id));
  DATA.deviceLinks.forEach(l => {
    if (present.has(l.a) && present.has(l.z))
      edges.push({a:l.a, z:l.z, prot:l.prot, cap:l.cap});
  });
  if (detail >= 3) DATA.pons.forEach(p => {
    if (present.has(p.olt) && present.has(p.id)) edges.push({a:p.olt, z:p.id, pon:true});
  });
  expanded.forEach(pid => (ontsByPon.get(pid)||[]).forEach(o => {
    if (present.has(pid) && present.has(o)) edges.push({a:pid, z:o, pon:true});
  }));

  nodes.forEach(n => { const p = prev.get(n.id); if (p) { n.x = p.x; n.y = p.y; } });
  index();
  layout(true);

  function mk(id, kind, tier){
    return {id, kind, tier, x:0, y:0, vx:0, vy:0, r: kind==='device' ? 0 : (kind==='pon'?5:3)};
  }
}

let adj = new Map(), nmap = new Map();
function index(){
  nmap = new Map(nodes.map(n => [n.id, n]));
  adj = new Map(nodes.map(n => [n.id, []]));
  edges.forEach(e => { adj.get(e.a)?.push(e.z); adj.get(e.z)?.push(e.a); });
}

/* ---------------------------------------------------------------- layout */
function layout(reset){
  const tiers = new Map();
  nodes.forEach(n => { if(!tiers.has(n.tier)) tiers.set(n.tier, []); tiers.get(n.tier).push(n); });
  const keys = [...tiers.keys()].sort((a,b)=>a-b);

  if (layoutMode === 'layered'){
    const GAP = 160, SUB = 27;
    const CFG = {device:{w:76, per:18}, pon:{w:18, per:45}, ont:{w:15, per:45}};
    const place = arr => {
      const n = arr.length, cfg = CFG[arr[0].kind] || CFG.device;
      const rows = Math.min(3, Math.max(1, Math.ceil(n / cfg.per)));
      const step = cfg.w / rows, span = Math.max(n * step, 320);
      arr.forEach((m,i) => {
        m.x = ((i + .5)/n - .5) * span;
        m.y = m.tier * GAP + ((i % rows) - (rows-1)/2) * SUB;
      });
    };
    keys.forEach(t => place(tiers.get(t)));
    for (let it = 0; it < 36; it++){
      const order = it % 2 ? keys : [...keys].reverse();
      order.forEach(t => {
        const arr = tiers.get(t);
        arr.forEach(n => {
          const nb = (adj.get(n.id)||[]).map(id => nmap.get(id))
                     .filter(m => m && m.tier !== t);
          n.bx = nb.length ? nb.reduce((s,m)=>s+m.x,0)/nb.length : n.x;
        });
        arr.sort((a,b) => a.bx - b.bx);
        place(arr);
      });
    }
  } else {
    if (reset) nodes.forEach((n,i) => {
      const a = i * 2.399, r = 26 * Math.sqrt(i);
      n.x = Math.cos(a)*r; n.y = Math.sin(a)*r;
    });
    ticks = 0; startSim();
  }
  if (reset) fit();
  draw();
}

function startSim(){
  if (raf) cancelAnimationFrame(raf);
  const step = () => {
    for (let s = 0; s < 2; s++) simStep();
    ticks++;
    if (ticks % 30 === 0 && ticks <= 300) fit();     // keep the settling graph in view
    if (ticks === 400) fit();
    draw();
    if (ticks < 400) raf = requestAnimationFrame(step); else raf = null;
  };
  raf = requestAnimationFrame(step);
}
function simStep(){
  const k = 0.9;
  for (let i = 0; i < nodes.length; i++){
    const a = nodes[i];
    for (let j = i+1; j < nodes.length; j++){
      const b = nodes[j];
      let dx = b.x-a.x, dy = b.y-a.y, d2 = dx*dx+dy*dy || .01;
      if (d2 > 90000) continue;
      const f = Math.min(900 / d2, 45);   // clamped: coincident nodes must not explode
      const d = Math.sqrt(d2); dx/=d; dy/=d;
      a.vx -= dx*f; a.vy -= dy*f; b.vx += dx*f; b.vy += dy*f;
    }
  }
  edges.forEach(e => {
    const a = nmap.get(e.a), b = nmap.get(e.z);
    if(!a||!b) return;
    const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||.01;
    const f=(d-70)*0.02;
    a.vx += dx/d*f; a.vy += dy/d*f; b.vx -= dx/d*f; b.vy -= dy/d*f;
  });
  nodes.forEach(n => {
    if (n.fixed) { n.vx = n.vy = 0; return; }
    n.vx -= n.x*0.0012;
    n.vy += ((n.tier * 170) - n.y) * 0.025;
    n.vx *= k; n.vy *= k;
    const sp = Math.hypot(n.vx, n.vy);
    if (sp > 30){ n.vx = n.vx/sp*30; n.vy = n.vy/sp*30; }
    n.x += n.vx; n.y += n.vy;
  });
}

function fit(){
  if (!nodes.length) return;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  nodes.forEach(n => { x0=Math.min(x0,n.x); x1=Math.max(x1,n.x); y0=Math.min(y0,n.y); y1=Math.max(y1,n.y); });
  const pad = 90;
  const k = Math.min((W-pad*2)/Math.max(x1-x0,1), (H-pad*2)/Math.max(y1-y0,1), 2.2);
  view.k = Math.max(k, .06);
  view.x = W/2 - (x0+x1)/2*view.k;
  view.y = H/2 - (y0+y1)/2*view.k;
}

/* ----------------------------------------------------------------- colour */
const ROLE = {core:'violet', aggregation:'accent', access:'accent', olt:'ok'};
function nodeFill(n){
  const d = byId.get(n.id);
  if (n.kind === 'ont') return alarmOn.has(n.id) ? C.stop : C.ink3;
  if (n.kind === 'pon') return (d.util||0) > 70 ? C.amber : C.ok;
  const by = document.getElementById('colorby').value;
  if (by === 'role') return d.role === 'core' ? C.violet
                    : d.role === 'aggregation' ? C.accent
                    : d.role === 'access' ? C.ink2 : C.ok;
  if (by === 'vendor') return d.vendor === 'Juniper' ? C.accent : C.violet;
  if (by === 'release'){
    const rels = [...new Set(DATA.devices.map(x=>x.release))].sort();
    return palette[rels.indexOf(d.release) % palette.length];
  }
  const sites = Object.keys(DATA.sites).sort();
  return palette[sites.indexOf(d.site) % palette.length];
}
function nodeRing(n){
  const d = byId.get(n.id);
  if (n.kind === 'device'){
    if (defectIds.has(n.id)) return C.stop;
    if (driftIds.has(n.id)) return C.amber;
  }
  if (n.kind === 'ont' && alarmOn.has(n.id)) return C.stop;
  if (n.kind === 'pon' && n.id === incident.pon) return C.stop;
  return null;
}

function relevant(){
  const mode = document.getElementById('mode').value;
  if (mode === 'none') return null;
  const set = new Set();
  if (mode === 'drift') driftIds.forEach(i => set.add(i));
  if (mode === 'defect') defectIds.forEach(i => set.add(i));
  if (mode === 'paths') driftedSvcDevices.forEach(i => set.add(i));
  if (mode === 'incident'){
    set.add(incident.olt); set.add(incident.pon);
    (ontsByPon.get(incident.pon)||[]).forEach(o => set.add(o));
    const olt = byId.get(incident.olt);
    DATA.deviceLinks.forEach(l => { if (l.a === incident.olt) set.add(l.z); if (l.z === incident.olt) set.add(l.a); });
  }
  return set;
}

let focusSet = null;   // selection-driven highlight

/* ------------------------------------------------------------------ draw */
function draw(){
  if (!W) return;
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(view.x, view.y); ctx.scale(view.k, view.k);

  const rel = relevant();
  const hot = focusSet || rel;
  const dim = a => hot ? (a ? 1 : .12) : 1;

  ctx.lineWidth = 1/view.k;
  edges.forEach(e => {
    const a = nmap.get(e.a), b = nmap.get(e.z);
    if (!a || !b) return;
    const on = !hot || (hot.has(e.a) && hot.has(e.z));
    ctx.globalAlpha = on ? (hot ? .95 : .6) : .07;
    ctx.strokeStyle = on && hot ? C.accent : C.edge;
    ctx.setLineDash(e.prot === 'unprotected' ? [4/view.k, 4/view.k] : []);
    ctx.lineWidth = (on && hot ? 1.8 : 1)/view.k;
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  });
  ctx.setLineDash([]);

  const showLabel = view.k > .55;
  nodes.forEach(n => {
    const d = byId.get(n.id);
    ctx.globalAlpha = dim(!hot || hot.has(n.id));
    const isSel = selected === n.id, isHov = hovered === n.id;

    if (n.kind === 'device'){
      const w = 68, h = 20;
      ctx.fillStyle = nodeFill(n);
      roundRect(n.x-w/2, n.y-h/2, w, h, 3); ctx.fill();
      const ring = nodeRing(n);
      if (ring){ ctx.strokeStyle = ring; ctx.lineWidth = 2.2/view.k;
        roundRect(n.x-w/2-2, n.y-h/2-2, w+4, h+4, 4); ctx.stroke(); }
      if (isSel || isHov){ ctx.strokeStyle = C.ink; ctx.lineWidth = 2/view.k;
        roundRect(n.x-w/2-4.5, n.y-h/2-4.5, w+9, h+9, 5); ctx.stroke(); }
      if (showLabel){
        ctx.fillStyle = C.ground; ctx.font = `500 ${10}px ${'IBM Plex Sans, sans-serif'}`;
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(clip(d.name, 11), n.x, n.y+.5);
      }
    } else {
      const r = n.kind === 'pon' ? 5.5 : 3.2;
      ctx.fillStyle = nodeFill(n);
      ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, 6.284); ctx.fill();
      const ring = nodeRing(n);
      if (ring){ ctx.strokeStyle = ring; ctx.lineWidth = 1.8/view.k;
        ctx.beginPath(); ctx.arc(n.x, n.y, r+2.5, 0, 6.284); ctx.stroke(); }
      if (isSel || isHov){ ctx.strokeStyle = C.ink; ctx.lineWidth = 1.6/view.k;
        ctx.beginPath(); ctx.arc(n.x, n.y, r+5, 0, 6.284); ctx.stroke(); }
    }
  });
  ctx.globalAlpha = 1;
  ctx.restore();
  drawTierLabels();
}

function drawTierLabels(){
  if (layoutMode !== 'layered') return;
  const names = ['Core','Aggregation','Access','OLT','PON','ONT'];
  ctx.save();
  ctx.font = `500 10px ${'IBM Plex Mono, monospace'}`;
  ctx.fillStyle = C.ink3; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  const seen = new Set(nodes.map(n=>n.tier));
  [...seen].sort().forEach(t => {
    const y = t * 160 * view.k + view.y;
    if (y < 14 || y > H-8) return;
    ctx.fillText(names[t].toUpperCase(), 14, y);
  });
  ctx.restore();
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
const clip = (s,n) => !s ? '' : (s.length > n ? s.slice(0,n-1)+'…' : s);

/* ------------------------------------------------------------ interaction */
let drag = null;
cv.addEventListener('mousedown', e => {
  const p = toWorld(e); const n = pick(p);
  drag = n ? {node:n, ox:p.x-n.x, oy:p.y-n.y} : {pan:true, x:e.clientX, y:e.clientY, vx:view.x, vy:view.y};
  cv.classList.add('grabbing');
});
addEventListener('mousemove', e => {
  if (drag){
    if (drag.pan){ view.x = drag.vx + (e.clientX-drag.x); view.y = drag.vy + (e.clientY-drag.y); }
    else { const p = toWorld(e); drag.node.x = p.x-drag.ox; drag.node.y = p.y-drag.oy; drag.node.fixed = true; }
    draw(); return;
  }
  const p = toWorld(e); const n = pick(p);
  const id = n ? n.id : null;
  if (id !== hovered){ hovered = id; draw(); }
  tooltip(n, e);
});
addEventListener('mouseup', () => { drag = null; cv.classList.remove('grabbing'); });
cv.addEventListener('click', e => { const n = pick(toWorld(e)); select(n ? n.id : null); });
cv.addEventListener('dblclick', e => {
  const n = pick(toWorld(e));
  if (n && n.kind === 'pon'){
    expanded.has(n.id) ? expanded.delete(n.id) : expanded.add(n.id);
    build();
  }
});
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const f = Math.exp(-e.deltaY * 0.0016);
  const k2 = Math.max(.05, Math.min(6, view.k * f));
  const r = cv.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  view.x = mx - (mx - view.x) * (k2/view.k);
  view.y = my - (my - view.y) * (k2/view.k);
  view.k = k2; draw();
}, {passive:false});
addEventListener('keydown', e => { if (e.key === 'Escape') select(null); });

function toWorld(e){
  const r = cv.getBoundingClientRect();
  return {x:(e.clientX-r.left-view.x)/view.k, y:(e.clientY-r.top-view.y)/view.k};
}
function pick(p){
  for (let i = nodes.length-1; i >= 0; i--){
    const n = nodes[i];
    if (n.kind === 'device'){
      if (Math.abs(p.x-n.x) < 36 && Math.abs(p.y-n.y) < 12) return n;
    } else {
      const base = n.kind === 'pon' ? 8 : 6;
      const r = Math.max(base, 11/view.k);      // keep small nodes clickable when zoomed out
      if ((p.x-n.x)**2 + (p.y-n.y)**2 < r*r) return n;
    }
  }
  return null;
}
function tooltip(n, e){
  const t = document.getElementById('tip');
  if (!n){ t.style.display='none'; return; }
  const d = byId.get(n.id);
  let html = '';
  if (n.kind === 'device') html = `<b>${esc(d.name)}</b><br><em>${esc(d.model)} · ${esc(d.role)} · ${esc(d.release||'—')}</em>`;
  if (n.kind === 'pon') html = `<b>${esc(d.id)}</b><br><em>${d.onts} ONTs · ${d.util}% of 1:${d.ratio}</em>`;
  if (n.kind === 'ont') html = `<b>${esc(d.serial||d.id)}</b><br><em>${esc(d.model)} · ${d.rx} dBm${d.alarm?' · ALARM':''}</em>`;
  t.innerHTML = html;
  const r = cv.getBoundingClientRect();
  t.style.display = 'block';
  t.style.left = Math.min(e.clientX - r.left + 14, r.width - 275) + 'px';
  t.style.top  = Math.min(e.clientY - r.top + 14, r.height - 70) + 'px';
}
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* -------------------------------------------------------------- selection */
function select(id, focusView){
  selected = id;
  focusSet = null;
  if (id){
    const d = byId.get(id);
    if (d && d.kind === 'device'){
      const s = new Set([id]);
      DATA.deviceLinks.forEach(l => { if (l.a===id) s.add(l.z); if (l.z===id) s.add(l.a); });
      DATA.pons.filter(p => p.olt === id).forEach(p => s.add(p.id));
      focusSet = s;
    }
    if (d && d.kind === 'pon'){ focusSet = new Set([id, d.olt, ...(ontsByPon.get(id)||[])]); }
    if (d && d.kind === 'ont'){ focusSet = new Set([id, d.pon, byId.get(d.pon)?.olt]); }
    if (d && d.kind === 'service'){ focusSet = new Set(d.devices); }
    if (d && d.kind === 'sub'){
      const o = ontBySub.get(id), sv = svcBySub.get(id);
      const s = new Set();
      if (o){ s.add(o); const p = byId.get(o).pon; s.add(p); s.add(byId.get(p)?.olt); }
      if (sv) byId.get(sv).devices.forEach(x => s.add(x));
      focusSet = s;
    }
  }
  if (focusView && id){
    const n = nmap.get(id);
    if (n){ view.k = Math.max(view.k, .9); view.x = W/2 - n.x*view.k; view.y = H/2 - n.y*view.k; }
  }
  renderPanel();
  draw();
}

/* ------------------------------------------------------------------ panel */
let tab = 'inspect';
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
  tab = b.dataset.tab; renderPanel();
}));

function renderPanel(){
  const el = document.getElementById('panel');
  el.innerHTML = tab === 'findings' ? findingsHtml() : inspectHtml();
  el.querySelectorAll('[data-go]').forEach(r => r.addEventListener('click', () => {
    const id = r.dataset.go;
    if (byId.get(id)?.kind === 'pon' && +document.getElementById('detail').value < 3){
      document.getElementById('detail').value = '3'; build();
    }
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x.dataset.tab === 'inspect'));
    tab = 'inspect';
    select(id, true);
  }));
  el.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => {
    document.getElementById('mode').value = b.dataset.mode; draw();
  }));
}

function inspectHtml(){
  if (!selected) return overviewHtml();
  const d = byId.get(selected);
  if (!d) return overviewHtml();
  if (d.kind === 'device') return deviceHtml(d);
  if (d.kind === 'pon') return ponHtml(d);
  if (d.kind === 'ont') return ontHtml(d);
  if (d.kind === 'sub') return subHtml(d);
  if (d.kind === 'service') return svcHtml(d);
  return overviewHtml();
}

function overviewHtml(){
  const f = DATA.findings;
  return `
  <h2>Nothing selected</h2>
  <div class="sub">click a node, or open Findings</div>
  <p class="note">This is the CTTC ontology rendered as a graph. Device models, counts and
  software releases follow the 18 May assessment; <b>everything below device level is
  synthetic placeholder data</b> shaped to match, so the queries have something to return.</p>
  <div class="sechead">Graph contents</div>
  <div class="list">
    ${row('Devices', DATA.devices.length)}
    ${row('Device links', DATA.deviceLinks.length)}
    ${row('PON trees', DATA.pons.length)}
    ${row('Services', DATA.services.length)}
    ${row('Subscribers', DATA.subs.length)}
    ${row('Open alarms', DATA.alarms.length)}
  </div>
  <div class="sechead">What the graph found</div>
  <div class="list">
    ${row('Version outliers', f.drift.length)}
    ${row('Devices on defect-affected software', f.defects.length)}
    ${row('Services off their intended path', f.paths.length)}
    ${row('Services with no alternate core', f.spof.services)}
  </div>`;
  function row(k,v){ return `<div class="row static"><b>${k}</b><span class="n">${v}</span></div>`; }
}

function deviceHtml(d){
  const links = DATA.deviceLinks.filter(l => l.a === d.id || l.z === d.id)
    .map(l => ({peer: l.a === d.id ? l.z : l.a, prot: l.prot, cap: l.cap}));
  const pons = DATA.pons.filter(p => p.olt === d.id);
  const svcs = DATA.services.filter(s => s.devices.includes(d.id));
  const badges = [];
  if (driftIds.has(d.id)) badges.push(`<span class="badge warn">version outlier</span>`);
  if (defectIds.has(d.id)) badges.push(`<span class="badge bad">defect exposed</span>`);
  if (d.role === 'core') badges.push(`<span class="badge info">single core</span>`);
  if (!badges.length) badges.push(`<span class="badge good">nominal</span>`);

  return `
  <h2>${esc(d.name)}</h2>
  <div class="sub">${esc(d.id)}</div>
  <div class="badges">${badges.join('')}</div>
  <dl class="kv">
    <dt>Model</dt><dd>${esc(d.model)}</dd>
    <dt>Vendor</dt><dd>${esc(d.vendor)}</dd>
    <dt>Role</dt><dd>${esc(d.role)}</dd>
    <dt>Site</dt><dd>${esc(DATA.sites[d.site]?.name || '—')}</dd>
    <dt>Release</dt><dd>${esc(d.release||'—')} ${d.outlier?`<span style="color:var(--amber)">· fleet is on ${esc(d.dominant)}</span>`:''}</dd>
    <dt>Mgmt IP</dt><dd>${esc(d.mgmt_ip||'—')}</dd>
    <dt>Ports</dt><dd>${d.ports}</dd>
  </dl>
  ${d.defects.length ? `<div class="sechead">Known defects in this release</div>
    <div class="list">${d.defects.map(x =>
      `<div class="row static"><b>${esc(x.symptom)}</b><span class="n">${esc(x.severity)}</span></div>`).join('')}</div>` : ''}
  <div class="sechead">Blast radius</div>
  <div class="list">
    <div class="row static"><b>Services traversing</b><span class="n">${svcs.length}</span></div>
    <div class="row static"><b>Subscribers behind them</b><span class="n">${d.subscribers}</span></div>
    ${pons.length ? `<div class="row static"><b>PON trees served</b><span class="n">${pons.length}</span></div>` : ''}
  </div>
  ${links.length ? `<div class="sechead">Adjacent devices</div><div class="list">${
    links.map(l => `<div class="row" data-go="${l.peer}"><b>${esc(byId.get(l.peer)?.name||l.peer)}</b>
      <span class="n">${l.cap}G${l.prot==='unprotected'?' · unprot':''}</span></div>`).join('')}</div>` : ''}
  ${svcs.length ? `<div class="sechead">Services on this device</div><div class="list">${
    svcs.slice(0,12).map(s => `<div class="row" data-go="${s.id}"><b>${esc(s.circuit)}</b>
      <span class="n">${esc(s.cls)}${s.drifted?' · drifted':''}</span></div>`).join('')}</div>` : ''}
  ${pons.length ? `<div class="sechead">PON trees</div><div class="list">${
    pons.map(p => `<div class="row" data-go="${p.id}"><b>${esc(p.id.split(':')[1])}</b>
      <span class="n">${p.onts} ONTs · ${p.util}%</span></div>`).join('')}</div>` : ''}`;
}

function ponHtml(d){
  const olt = byId.get(d.olt);
  const onts = ontsByPon.get(d.id) || [];
  const alarmed = onts.filter(o => alarmOn.has(o)).length;
  return `
  <h2>${esc(d.id.split(':')[1])}</h2>
  <div class="sub">PON tree · ${esc(d.tech)}</div>
  <div class="badges">
    ${alarmed ? `<span class="badge bad">${alarmed} ONTs in alarm</span>` : `<span class="badge good">no alarms</span>`}
    ${d.util > 70 ? `<span class="badge warn">${d.util}% filled</span>` : ''}
  </div>
  <dl class="kv">
    <dt>OLT</dt><dd>${esc(olt?.name||'—')}</dd>
    <dt>Split</dt><dd>1:${d.ratio}</dd>
    <dt>ONTs</dt><dd>${d.onts}</dd>
    <dt>Modelled</dt><dd>${onts.length ? onts.length + ' individually' : 'count only'}</dd>
  </dl>
  <div class="meter"><i class="${d.util>70?'hot':''}" style="width:${Math.min(100,d.util)}%"></i></div>
  ${onts.length ? `<div class="sechead">ONTs</div><div class="list">${
    onts.slice(0,40).map(o => { const x = byId.get(o); return `<div class="row" data-go="${o}">
      <b>${esc(x.serial||o)}</b><span class="n">${x.rx} dBm${x.alarm?' · ALARM':''}</span></div>`;}).join('')}</div>`
    : `<p class="note" style="margin-top:12px">Individual ONTs are not modelled for this tree — the
       demo dataset details two PONs. Double-click a detailed PON on the canvas to expand it.</p>`}`;
}

function ontHtml(d){
  const pon = byId.get(d.pon), olt = pon ? byId.get(pon.olt) : null;
  const sub = d.sub ? byId.get(d.sub) : null;
  const a = alarmOn.get(d.id);
  return `
  <h2>${esc(d.serial||d.id)}</h2>
  <div class="sub">ONT · ${esc(d.model)}</div>
  <div class="badges">${a ? `<span class="badge bad">${esc(a.type)}</span>` : `<span class="badge good">reachable</span>`}</div>
  <dl class="kv">
    <dt>Firmware</dt><dd>${esc(d.fw)}</dd>
    <dt>Rx level</dt><dd>${d.rx} dBm</dd>
    <dt>PON</dt><dd>${esc(d.pon)}</dd>
    <dt>OLT</dt><dd>${esc(olt?.name||'—')}</dd>
    <dt>Subscriber</dt><dd>${esc(sub?.account||'—')}</dd>
  </dl>
  ${a ? `<div class="sechead">Alarm</div><p class="note">${esc(a.text)}<br><span style="color:var(--ink-3)">${esc(a.at)}</span></p>` : ''}
  <div class="sechead">Upstream</div>
  <div class="list">
    <div class="row" data-go="${d.pon}"><b>PON tree</b><span class="n">${esc(d.pon.split(':')[1])}</span></div>
    ${olt ? `<div class="row" data-go="${olt.id}"><b>OLT</b><span class="n">${esc(olt.name)}</span></div>` : ''}
    ${sub ? `<div class="row" data-go="${sub.id}"><b>Subscriber</b><span class="n">${esc(sub.account)}</span></div>` : ''}
  </div>`;
}

function subHtml(d){
  const o = ontBySub.get(d.id), sv = svcBySub.get(d.id);
  const svc = sv ? byId.get(sv) : null;
  return `
  <h2>${esc(d.account||d.id)}</h2>
  <div class="sub">Subscriber · ${esc(d.area||'—')}</div>
  <div class="badges">${d.crit === 'critical' ? `<span class="badge bad">critical</span>`
    : d.crit === 'high' ? `<span class="badge warn">high</span>` : `<span class="badge good">standard</span>`}</div>
  <dl class="kv">
    <dt>Premise</dt><dd>${esc(d.premise_id||'—')}</dd>
    <dt>Service area</dt><dd>${esc(d.area||'—')}</dd>
    <dt>ONT</dt><dd>${o ? esc(byId.get(o).serial) : '—'}</dd>
    <dt>Service</dt><dd>${svc ? esc(svc.circuit) : '—'}</dd>
  </dl>
  ${svc ? `<div class="sechead">Path to core</div><div class="path">${
    svc.devices.map(x => esc(byId.get(x)?.name||x)).join(' → ')}</div>
    <div class="list" style="margin-top:10px"><div class="row" data-go="${svc.id}">
      <b>Open service</b><span class="n">${esc(svc.cls)}</span></div></div>` : ''}
  ${o ? `<div class="list" style="margin-top:10px"><div class="row" data-go="${o}">
    <b>Open ONT</b><span class="n">${esc(byId.get(o).serial)}</span></div></div>` : ''}`;
}

function svcHtml(d){
  const sub = d.sub ? byId.get(d.sub) : null;
  const added = d.current.filter(p => !d.intended.includes(p));
  const dropped = d.intended.filter(p => !d.current.includes(p));
  return `
  <h2>${esc(d.circuit)}</h2>
  <div class="sub">Service · ${esc(d.cls)}</div>
  <div class="badges">
    ${d.drifted ? `<span class="badge warn">off intended path</span>` : `<span class="badge good">on intended path</span>`}
    ${d.cls === 'cell_backhaul' ? `<span class="badge info">cell backhaul</span>` : ''}
  </div>
  <dl class="kv">
    <dt>Bandwidth</dt><dd>${d.bw} Mbps</dd>
    <dt>Subscriber</dt><dd>${esc(sub?.account||'—')}</dd>
    <dt>Hops</dt><dd>${d.current.length}</dd>
  </dl>
  <div class="sechead">Current path</div>
  <div class="path">${d.current.map(p => {
    const cls = added.includes(p) ? 'add' : '';
    return `<span class="${cls}">${esc(byId.get(portDev.get(p))?.name || '?')}:${esc(portName.get(p)||p)}</span>`;
  }).join(' → ')}</div>
  ${d.drifted ? `<div class="sechead">No longer traversed</div>
    <div class="path">${dropped.map(p =>
      `<span class="drop">${esc(byId.get(portDev.get(p))?.name||'?')}:${esc(portName.get(p)||p)}</span>`).join(' → ')}</div>
    <p class="note" style="margin-top:10px">The service is up. It is riding a port that was not
    in its intended path — a condition that raises no alarm today.</p>` : ''}
  <div class="sechead">Devices traversed</div>
  <div class="list">${d.devices.map(x =>
    `<div class="row" data-go="${x}"><b>${esc(byId.get(x)?.name||x)}</b>
     <span class="n">${esc(byId.get(x)?.role||'')}</span></div>`).join('')}</div>`;
}

function findingsHtml(){
  const f = DATA.findings;
  const inc = f.incident;
  const oltName = esc(byId.get(inc.olt)?.name || inc.olt);
  return `
  <p class="note">Each card is what one of the schema's Cypher queries returns, computed over
  the graph in the canvas. Click any row to select it.</p>

  <div class="card">
    <div class="ch"><b>Live incident</b><span>Q1 · fault domain</span></div>
    <div class="cb">
      <p><b>${inc.onts_down} ONTs</b> unreachable inside a
      ${Math.round((new Date(inc.window_end)-new Date(inc.window_start))/1000)}-second window,
      all on one PON tree behind <b>${oltName}</b>.</p>
      <p style="color:var(--amber)">Supporting: ${inc.supporting.map(s=>esc(s.type)).join(', ') || '—'}</p>
      <p style="color:var(--ink-3)">Ruled out: ${inc.ruled_out.map(esc).join(' · ')}</p>
      <p><b>Narrowed to:</b> the OLT uplink and its aggregation interface.</p>
      <div class="list">
        <div class="row" data-go="${inc.pon}"><b>${esc(String(inc.pon).split(':')[1])}</b><span class="n">${inc.onts_down} down</span></div>
        <div class="row" data-go="${inc.olt}"><b>${oltName}</b><span class="n">OLT</span></div>
      </div>
      <button class="qbtn" data-mode="incident">Highlight on canvas</button>
    </div>
  </div>

  <div class="card">
    <div class="ch"><b>Version drift</b><span>Q5 · ${f.drift.length} outliers</span></div>
    <div class="cb">
      <p>Devices not on their model's dominant release.</p>
      <div class="list">${f.drift.map(r => `<div class="row" data-go="${r.id}">
        <b>${esc(r.device)}</b><span class="n">${esc(r.outlier)} vs ${esc(r.dominant)}</span></div>`).join('')}</div>
      <button class="qbtn" data-mode="drift">Highlight on canvas</button>
    </div>
  </div>

  <div class="card">
    <div class="ch"><b>Defect exposure</b><span>Q2 · blast radius</span></div>
    <div class="cb">
      <p><b>${f.defects.length} devices</b> run software with an open defect recorded against it.
      Note the shape of this one: the release San Angelo was downgraded <em>away from</em> is still
      running everywhere else.</p>
      <div class="list">${f.defects.slice(0,10).map(r => `<div class="row" data-go="${r.id}">
        <b>${esc(r.device)}</b><span class="n">${esc(r.release)} · ${r.subscribers} subs</span></div>`).join('')}</div>
      <button class="qbtn" data-mode="defect">Highlight on canvas</button>
    </div>
  </div>

  <div class="card">
    <div class="ch"><b>Path drift</b><span>Q4 · ${f.paths.length} services</span></div>
    <div class="cb">
      <p>Up, billing normally, and not on the path they were designed for.</p>
      <div class="list">${f.paths.map(r => `<div class="row" data-go="${r.id}">
        <b>${esc(r.circuit)}</b><span class="n">${esc(r.cls)}</span></div>`).join('')}</div>
      <button class="qbtn" data-mode="paths">Highlight on canvas</button>
    </div>
  </div>

  <div class="card">
    <div class="ch"><b>Core concentration</b><span>Q3 · SPOF</span></div>
    <div class="cb">
      <p><b>${f.spof.services} services</b> and <b>${f.spof.subscribers} subscribers</b> have no
      modelled path that avoids the Goldthwaite core.</p>
      <p style="color:var(--ink-3)">Classes affected: ${f.spof.classes.map(esc).join(', ')}</p>
      <div class="list">${f.spof.core.map(id => `<div class="row" data-go="${id}">
        <b>${esc(byId.get(id)?.name||id)}</b><span class="n">core</span></div>`).join('')}</div>
    </div>
  </div>`;
}

/* ----------------------------------------------------------------- search */
const q = document.getElementById('q'), results = document.getElementById('results');
q.addEventListener('input', () => {
  const v = q.value.trim().toLowerCase();
  if (v.length < 2){ results.classList.remove('open'); return; }
  const hits = [];
  const push = (id, label, sub) => { if (hits.length < 25) hits.push({id, label, sub}); };
  DATA.devices.forEach(d => {
    if ((d.name+d.id+(d.aliases||[]).join(' ')+d.model).toLowerCase().includes(v))
      push(d.id, d.name, `${d.model} · ${d.release||''}`);
  });
  DATA.services.forEach(s => {
    if ((s.circuit+s.cls).toLowerCase().includes(v)) push(s.id, s.circuit, s.cls);
  });
  DATA.subs.forEach(s => {
    if ((String(s.account)+s.id+String(s.area)).toLowerCase().includes(v))
      push(s.id, s.account, s.area);
  });
  DATA.onts.forEach(o => { if (String(o.serial).toLowerCase().includes(v)) push(o.id, o.serial, 'ONT'); });
  results.innerHTML = hits.length
    ? hits.map(h => `<div data-id="${h.id}">${esc(h.label)}<small>${esc(h.sub)}</small></div>`).join('')
    : `<div style="color:var(--ink-3)">no match</div>`;
  results.classList.add('open');
  results.querySelectorAll('[data-id]').forEach(el => el.addEventListener('click', () => {
    results.classList.remove('open'); q.value = '';
    const id = el.dataset.id;
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x.dataset.tab === 'inspect'));
    tab = 'inspect';
    select(id, true);
  }));
});
q.addEventListener('blur', () => setTimeout(() => results.classList.remove('open'), 180));

/* ---------------------------------------------------------------- controls */
document.getElementById('detail').addEventListener('change', build);
document.getElementById('colorby').addEventListener('change', () => { legend(); draw(); });
document.getElementById('mode').addEventListener('change', () => { legend(); draw(); });
document.getElementById('fit').addEventListener('click', () => { fit(); draw(); });
document.getElementById('layout').addEventListener('click', e => {
  layoutMode = layoutMode === 'layered' ? 'force' : 'layered';
  e.target.textContent = layoutMode === 'layered' ? 'Layered' : 'Force';
  nodes.forEach(n => n.fixed = false);
  layout(true);
});

function legend(){
  const by = document.getElementById('colorby').value;
  const mode = document.getElementById('mode').value;
  let items = [];
  if (by === 'role') items = [['Core','var(--violet)'],['Aggregation','var(--accent)'],
    ['Access','var(--ink-2)'],['OLT','var(--ok)']];
  if (by === 'vendor') items = [['Juniper','var(--accent)'],['Calix','var(--violet)']];
  if (by === 'release') items = [...new Set(DATA.devices.map(d=>d.release))].sort()
    .map((r,i) => [r, palette[i % palette.length]]);
  if (by === 'site') items = Object.keys(DATA.sites).sort()
    .map((s,i) => [DATA.sites[s].name, palette[i % palette.length]]);
  const rings = [['version outlier','var(--amber)'],['defect exposed','var(--stop)']];
  document.getElementById('legend').innerHTML =
    `<div class="hdr">colour by ${by}</div>` +
    items.map(([l,c]) => `<div><i style="background:${c}"></i>${esc(l)}</div>`).join('') +
    `<div class="hdr" style="margin-top:6px">ring</div>` +
    rings.map(([l,c]) => `<div><i style="background:transparent;border:2px solid ${c}"></i>${esc(l)}</div>`).join('') +
    (mode !== 'none' ? `<div class="hdr" style="margin-top:6px">highlight: ${esc(mode)}</div>` : '');
}

/* -------------------------------------------------------------------- go */
ready = true;
build();
legend();
renderPanel();
resize();
requestAnimationFrame(() => { resize(); fit(); draw(); });
</script>
